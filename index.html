<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>turbocharm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #0f172a;
        }
        .container {
            position: relative;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%);
        }
        /* Świecące, animowane tło */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite alternate ease-in-out;
        }
        .blob-1 {
            top: 20%;
            left: 20%;
            width: 350px;
            height: 350px;
            background: #8b5cf6;
            animation-delay: 0s;
        }
        .blob-2 {
            bottom: 20%;
            right: 20%;
            width: 400px;
            height: 400px;
            background: #ec4899;
            animation-delay: -3s;
        }
        .blob-3 {
            top: 40%;
            right: 35%;
            width: 300px;
            height: 300px;
            background: #3b82f6;
            animation-delay: -6s;
        }
        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, 50px) scale(1.1);
            }
        }
        /* Karta ze szkła (Glassmorphism) */
        .card {
            position: relative;
            z-index: 10;
            padding: 3rem 5rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        /* Gradientowy napis */
        .logo {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(236, 72, 153, 0.3);
            text-transform: lowercase;
        }
        .tagline {
            margin-top: 1rem;
            color: #94a3b8;
            font-size: 1.125rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        
        <div class="card">
            <h1 class="logo">turbocharm</h1>
            <p class="tagline">In progress</p>
        </div>
    </div>
</body>
</html>
